# Railway config-as-code: build the Dockerfile and health-check the API.
# Also set on the service: a volume mounted at /data, RAILWAY_RUN_UID=0 (volumes mount as root),
# AUDIT_API_TOKENS, SESSION_SECRET and optionally AUDITOR_CONTACT_URL.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
